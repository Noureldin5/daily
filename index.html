<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECE5C7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A2E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Daily</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lock" class="lock" hidden>
    <form id="lockForm" class="lockbox">
      <h1>Daily</h1>
      <label for="pinIn">Enter your PIN</label>
      <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
      <button type="submit" class="btn">Unlock</button>
      <p id="lockMsg" class="muted" aria-live="polite"></p>
    </form>
  </div>

  <main id="view" class="wrap" tabindex="-1"></main>

  <nav class="tabs" aria-label="Pages">
    <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9"/></svg>Today</button>
    <button data-tab="routine"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Routine</button>
    <button data-tab="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>Train</button>
    <button data-tab="dhikr"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="17" cy="7.5" r="1.6"/><circle cx="18.5" cy="13" r="1.6"/><circle cx="15.5" cy="18" r="1.6"/><circle cx="9" cy="18.5" r="1.6"/><circle cx="5.5" cy="13.5" r="1.6"/><circle cx="7" cy="8" r="1.6"/></svg>Dhikr</button>
    <button data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>Learn</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="rest" class="rest" role="timer" aria-live="off" hidden></div>

  <script src="data.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
